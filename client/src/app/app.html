<div class="flex min-h-screen flex-col">
  @if (isLoggedIn()) {
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-3">
        <a class="flex items-center gap-2" routerLink="/">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-emerald-600 text-sm font-black text-white">
            Rx
          </span>
          <span class="leading-tight">
            <span class="block text-sm font-bold text-slate-900">PharmaLive</span>
            <span class="block text-[11px] text-slate-500">Real-time prescription queue</span>
          </span>
        </a>

        <nav class="ml-4 hidden items-center gap-1 text-sm font-medium text-slate-600 sm:flex">
          @if (role() === 'Pharmacist') {
            <a
              routerLink="/pharmacist"
              routerLinkActive="bg-emerald-50 text-emerald-700"
              class="rounded-lg px-3 py-1.5 transition hover:bg-slate-100"
            >
              Board
            </a>
          }
          @if (role() === 'Doctor') {
            <a
              routerLink="/doctor"
              routerLinkActive="bg-emerald-50 text-emerald-700"
              class="rounded-lg px-3 py-1.5 transition hover:bg-slate-100"
            >
              My prescriptions
            </a>
          }
          @if (role() === 'Display') {
            <a
              routerLink="/display"
              routerLinkActive="bg-emerald-50 text-emerald-700"
              class="rounded-lg px-3 py-1.5 transition hover:bg-slate-100"
            >
              Waiting room
            </a>
          }
        </nav>

        <div class="ml-auto flex items-center gap-3">
          <app-connection-badge [state]="connectionState()" />

          <div class="hidden text-right leading-tight sm:block">
            <span class="block text-sm font-semibold text-slate-800">{{ userName() }}</span>
            <span class="block text-[11px] uppercase tracking-wide text-slate-400">{{ role() }}</span>
          </div>

          <button
            type="button"
            class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:border-rose-300 hover:bg-rose-50 hover:text-rose-700"
            (click)="logout()"
          >
            Sign out
          </button>
        </div>
      </div>
    </header>
  }

  <main class="flex-1">
    <router-outlet />
  </main>

  <app-toast-host />
</div>
